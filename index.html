<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#08090C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ledger" />
    <meta name="description" content="Ledger — personal money tracker for solo creators" />
    <link rel="manifest" href="/manifest.json" />
    <title>Ledger — Personal Money Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              canvas: '#08090C',
              'canvas-raised': '#0E1018',
              gold: '#F5C542',
              lime: '#B8F135',
              rose: '#FF6B8A',
              ice: '#8FB4FF',
            }
          }
        }
      }
    </script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      html, body {
        width: 100%;
        height: 100%;
        background-color: #08090C;
        color: #F4F6FB;
        font-family: 'Barlow', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overflow-x: hidden;
      }
      body {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        min-height: 100vh;
        min-height: 100dvh;
      }
      #root {
        min-height: 100vh;
        min-height: 100dvh;
        width: 100%;
      }
      /* Fallback utility classes in case Tailwind CDN is delayed */
      .flex { display: flex; }
      .flex-col { flex-direction: column; }
      .items-center { align-items: center; }
      .justify-center { justify-content: center; }
      .min-h-screen { min-height: 100vh; min-height: 100dvh; }
      .w-full { width: 100%; }
      .text-center { text-align: center; }
    </style>
  </head>
  <body class="bg-[#08090C] text-[#F4F6FB]">
    <div id="root">
      <!-- Fast initial splash prevents black screen before JS bundle evaluates -->
      <div style="min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;background-color:#08090C;color:#F4F6FB;padding:20px;text-align:center;">
        <div style="width:52px;height:52px;border-radius:18px;background-color:#F5C542;display:flex;align-items:center;justify-content:center;color:#000;font-weight:900;font-size:24px;box-shadow:0 8px 30px rgba(245,197,66,0.3);margin-bottom:16px;">
          L
        </div>
        <h1 style="font-size:18px;font-weight:700;color:#FFF;letter-spacing:-0.01em;margin-bottom:6px;">Studio Ledger</h1>
        <p id="splash-sub" style="font-size:12px;color:#7E8699;font-weight:500;letter-spacing:0.04em;">LAUNCHING...</p>
        <div id="recovery-btn-wrap" style="display:none;margin-top:20px;">
          <button onclick="clearAndReload()" style="padding:10px 20px;border-radius:12px;background:#F5C542;color:#000;font-weight:700;font-size:13px;border:none;cursor:pointer;">
            Tap to Refresh App
          </button>
        </div>
      </div>
    </div>

    <script>
      // Service worker registration with auto-update
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((registration) => {
            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('[SW] New version available; will activate on next refresh.');
                  }
                });
              }
            });
          }).catch((err) => {
            console.log('SW registration note:', err);
          });
        });
      }

      // 3.5-second watchdog: If React didn't mount, offer quick refresh & purge stale cache
      const watchdog = setTimeout(() => {
        const root = document.getElementById('root');
        const recoveryWrap = document.getElementById('recovery-btn-wrap');
        const splashSub = document.getElementById('splash-sub');
        if (recoveryWrap && splashSub) {
          splashSub.textContent = 'UPDATING WORKSPACE...';
          recoveryWrap.style.display = 'block';
        }
      }, 3500);

      window.clearAndReload = async function() {
        try {
          if ('serviceWorker' in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            for (const r of regs) await r.unregister();
          }
          if ('caches' in window) {
            const keys = await caches.keys();
            for (const k of keys) await caches.delete(k);
          }
        } catch (e) {}
        window.location.reload(true);
      };
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
